# Render.com 무료 웹 서비스 배포 설정 (Blueprint)
# - 클라이언트를 빌드한 뒤, 서버(Express + Socket.IO)가 API·실시간·정적 파일을 한 주소에서 함께 제공한다.
# - 무료 플랜은 디스크가 임시라서, 데이터(DB·강아지 사진)를 사용자 소유의 비공개 GitHub 저장소에
#   자동 저장했다가 재시작 시 되살린다 (MUNGLE_GITHUB_REPO + MUNGLE_GITHUB_TOKEN).
services:
  - type: web
    name: mungle-village
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: cd server && node --experimental-sqlite --import tsx src/main.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MUNGLE_PARK_CAPACITY
        value: "30"
      - key: MUNGLE_GITHUB_REPO
        sync: false
      - key: MUNGLE_GITHUB_TOKEN
        sync: false
      - key: MUNGLE_OPERATOR
        sync: false
      - key: MUNGLE_CONTACT
        sync: false
      - key: MUNGLE_ADMINS
        sync: false
      - key: MUNGLE_TRUST_PROXY
        value: "1"
      - key: MUNGLE_BACKUP_HOURS
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
