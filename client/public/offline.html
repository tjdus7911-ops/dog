<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff4e8">
<title>멍글마을 · 연결 확인</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #fff8ef; color: #5a4033; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 112px; height: auto; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { margin: 0; color: #8c7465; font-size: 15px; line-height: 1.6; }
  button { margin-top: 22px; border: 0; border-radius: 999px; background: #f39a7b; color: #fff; font-size: 16px; padding: 12px 28px;
    box-shadow: 0 4px 0 #ec7f5c; font-family: inherit; }
</style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="멍글마을 로고">
    <h1>인터넷 연결이 필요해요</h1>
    <p>멍글마을은 친구들과 실시간으로 함께하는 공간이라<br>연결된 상태에서만 열 수 있어요.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
